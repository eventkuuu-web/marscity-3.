<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Warga Mars City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Konsep: kantor catatan sipil kota Mars. Kartu tanda warga sebagai objek utama, peta kota sebagai ilustrasi. Palet diambil dari karakter: navy jas presiden, emas selempang, tosca Pico, bata tanah Mars. */
:root{--bg:#ebe8f1;--surface:#ffffff;--surface2:#f4f2f8;--ink:#1d2b4f;--sub:#555f7d;--line:#cdc8dc;--navy:#1d2b4f;--gold:#ffc65c;--gold-ink:#3a2704;--teal:#1b8f83;--brick:#b4452a;--focus:#1d2b4f;
--f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111b;--surface:#1b1a29;--surface2:#232236;--ink:#ecebf7;--sub:#a6a4c0;--line:#383650;--navy:#2b3c6b;--gold:#ffc65c;--gold-ink:#3a2704;--teal:#43c4b6;--brick:#e0795a;--focus:#ffc65c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12111b;--surface:#1b1a29;--surface2:#232236;--ink:#ecebf7;--sub:#a6a4c0;--line:#383650;--navy:#2b3c6b;--gold:#ffc65c;--gold-ink:#3a2704;--teal:#43c4b6;--brick:#e0795a;--focus:#ffc65c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:34px;height:auto;flex:none}
.brand h1{font-size:26px}
.brand p{color:var(--sub);font-size:14px}
.stats{display:flex;gap:18px;color:var(--sub);font-size:14px;flex-wrap:wrap}
.stats b{font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
nav.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:24px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 16px;font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--sub);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
section.view[hidden]{display:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h2{font-size:22px;margin-bottom:4px}
.panel .lead{color:var(--sub);margin-bottom:18px}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.in{width:100%;background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:11px 12px}
.in:focus-visible{border-color:var(--focus)}
.hint{font-size:13px;color:var(--sub);margin-top:6px;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;width:38px;height:38px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span{box-shadow:0 0 0 3px var(--focus)}
.pick{position:relative}
.pick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pick span{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface2);font-size:14px;font-weight:600}
.pick input:checked+span{border-color:var(--ink);background:var(--surface)}
.pick input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.pick svg{width:18px;height:26px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--surface);border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.cardbox{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media (max-width:820px){.cardbox{position:static}}
.card svg{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 10px 30px rgba(10,10,30,.28)}
.steps{margin:28px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 58px;position:relative;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-weight:600}
.steps b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;margin-bottom:2px}
.steps span{color:var(--sub);font-size:14.5px}
.mapbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:9px 16px;font-weight:700;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.zoom{display:flex;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.mapframe{border:2px solid var(--line);border-radius:var(--r);overflow:auto;height:min(72vh,640px);background:#a64829;touch-action:pan-x pan-y}
.mapframe svg{display:block}
.mapframe text{font-family:var(--f-display);paint-order:stroke;stroke:#3b1608;stroke-width:3px;stroke-linejoin:round;fill:#fff;cursor:default}
.mapframe .hit{cursor:pointer}
.mapframe .hit:hover rect.ring,.mapframe .hit:focus rect.ring{stroke:#ffc65c}
.info{margin-top:14px;min-height:92px}
.info h3{font-size:20px;margin-bottom:4px}
.info .tag{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.search{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.search .in{flex:1;min-width:200px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;list-style:none;padding:0;margin:0}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%;text-align:left;cursor:pointer}
.row:hover{border-color:var(--ink)}
.row .av{width:38px;flex:none}
.row .av svg{width:100%;height:auto;display:block}
.row .t{min-width:0}
.row b{display:block;font-family:var(--f-display);font-weight:500;font-size:17px;overflow-wrap:anywhere}
.row span{display:block;color:var(--sub);font-size:14px;overflow-wrap:anywhere}
.row i{font-style:normal;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--gold);color:var(--gold-ink);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;margin-top:3px}
dialog{border:0;border-radius:18px;padding:18px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(8,8,20,.6)}
dialog .actions{justify-content:space-between}
.foot{margin-top:36px;color:var(--sub);font-size:14px;max-width:70ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.empty{color:var(--sub);padding:18px 0}

nav.tabs small{font-family:var(--f-body);font-size:12px;color:var(--sub);margin-left:6px}
.done{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:center}
@media (max-width:820px){.done{grid-template-columns:minmax(0,1fr)}}
.done h2{font-size:28px;margin-bottom:6px}
.note2{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14.5px;color:var(--sub)}
.lockbox{text-align:center;padding:36px 16px}
.mini{font-size:20px;margin:26px 0 12px}
.row.mine{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
[hidden]{display:none!important}
.stage{position:relative;height:min(72vh,640px);border-radius:var(--r);overflow:hidden;border:2px solid var(--line);background:#f0b48a}
#c3d,#c3d canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:10px;top:10px;right:10px;background:rgba(29,43,79,.88);color:#fff;border-radius:12px;padding:8px 12px;font-size:14px;pointer-events:none}
.hud b{display:block;font-family:var(--f-display);font-size:17px}
.joy{position:absolute;left:16px;bottom:16px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.6);touch-action:none}
.joy i{position:absolute;left:33px;top:33px;width:40px;height:40px;border-radius:50%;background:#ffc65c;box-shadow:0 2px 8px #0005}
.stage:fullscreen{height:100dvh!important;width:100vw!important;border:0;border-radius:0;background:#f0b48a}
.stage:fullscreen #c3d,.stage:fullscreen #c3d canvas{height:100dvh;width:100vw}
.game-controls{position:absolute;right:16px;bottom:18px;display:flex;gap:12px;align-items:flex-end}
.game-btn{width:66px;height:66px;border-radius:50%;border:2px solid #fff;background:rgba(29,43,79,.82);color:#fff;font-weight:800;font-size:14px;box-shadow:0 3px 12px #0005;touch-action:none}
.game-btn:active{transform:scale(.94);background:#b8860b}
.stage:fullscreen .game-btn{width:76px;height:76px}
@media(max-width:600px){.stage{height:70vh;min-height:440px}.joy{width:104px;height:104px}.game-controls{right:12px;bottom:18px}.game-btn{width:62px;height:62px}}

</style>
</head>
<body>
<header class="top wrap">
<div class="brand"><svg id="logo" viewBox="0 -14 100 164" aria-hidden="true"></svg><div><h1>Mars City</h1><p>Daftar jadi warga, lalu jelajahi kota</p></div></div>
<div class="stats" id="stats"></div>
</header>
<div class="wrap">
<nav class="tabs" role="tablist" aria-label="Menu portal">
<button role="tab" id="tab-daftar" aria-selected="true" data-v="daftar">Daftar jadi warga</button>
<button role="tab" id="tab-jelajah" aria-selected="false" data-v="jelajah">Jelajahi kota<small id="lock">terkunci</small></button>
</nav>

<section class="view" id="v-daftar" role="tabpanel" aria-labelledby="tab-daftar">
<div class="grid2" id="reg-form">
<form class="panel" id="form" autocomplete="off" novalidate>
<h2>Isi kartu tanda warga</h2>
<p class="lead">Cukup empat isian. Kartu di sebelah berubah saat kamu mengetik.</p>
<label class="f" for="f-user">Nama akun (tanpa @)</label>
<input class="in" id="f-user" maxlength="24" placeholder="contoh: netizen_mars">
<label class="f" for="f-prof">Profesi di Mars City</label>
<input class="in" id="f-prof" maxlength="34" placeholder="contoh: Tukang Bawa Galon">
<p class="hint" id="f-hint" aria-live="polite"></p>
<div class="chips" id="chips" aria-label="Ide profesi"></div>
<label class="f" id="l-warna">Warna kapsul</label>
<div class="opt" id="o-warna" role="radiogroup" aria-labelledby="l-warna"></div>
<label class="f" id="l-acc">Aksesori</label>
<div class="opt" id="o-acc" role="radiogroup" aria-labelledby="l-acc"></div>
<div class="actions"><button class="btn pri" type="submit" id="b-reg">Daftar jadi warga</button><button class="btn" type="button" id="b-cancel" hidden>Batal</button></div>
<p class="hint" id="f-err" role="alert"></p>
</form>
<div class="cardbox"><div class="card" id="card" aria-live="polite"></div></div>
</div>
<div class="done" id="reg-done" hidden>
<div>
<h2 id="d-title"></h2>
<p class="lead" id="d-lead"></p>
<div class="actions"><button class="btn pri" type="button" id="b-go">Jelajahi Mars City</button><button class="btn" type="button" id="b-png">Simpan kartu (PNG)</button><button class="btn" type="button" id="b-edit">Ubah data</button></div>
<div class="note2" id="d-note" hidden></div>
</div>
<div class="card" id="card2"></div>
</div>
</section>

<section class="view" id="v-jelajah" role="tabpanel" aria-labelledby="tab-jelajah" hidden>
<div id="w3d"><div class="stage"><div id="c3d"></div><div class="hud" id="hud3"></div><div class="joy" id="joy" aria-label="Joystick"><i id="knob"></i></div><div class="game-controls"><button class="game-btn" type="button" id="b-jump">LOMPAT</button><button class="game-btn" type="button" id="b-full">⛶ LAYAR</button></div></div><p class="hint">Gerakkan karakter dengan tombol W A S D atau panah. Di HP, geser joystick kuning di kiri bawah.</p><div class="legend" id="legend3"></div></div>
<div class="actions"><button class="btn" type="button" id="b-home">Ke rumahku</button><button class="btn" type="button" id="b-mode">Lihat peta 2D</button></div>
<div id="w2d" hidden>
<div class="mapbar">
<div class="seg" role="group" aria-label="Pilih masa kota"><button type="button" data-d="2" aria-pressed="false">Hari 1–2</button><button type="button" data-d="3" aria-pressed="false">Hari 3</button><button type="button" data-d="4" aria-pressed="true">Hari 4</button></div>
<div class="zoom" role="group" aria-label="Zoom peta"><button type="button" id="z-out" aria-label="Perkecil">−</button><button type="button" id="z-in" aria-label="Perbesar">+</button></div>
</div>
<div class="mapframe" id="mapframe" tabindex="0" aria-label="Peta Mars City, geser untuk menjelajah"></div>
<div class="panel info" id="info"></div>
<div class="legend" id="legend" aria-label="Lompat ke tempat"></div>
</div>
<h2 class="mini">Warga Mars City</h2>
<div class="search"><input class="in" id="q" type="search" placeholder="Cari nama akun atau profesi" aria-label="Cari warga"></div>
<ul class="list" id="list"></ul>
<p class="empty" id="empty" hidden>Belum ada warga dengan kata itu.</p>
</section>
<p class="foot" id="foot"></p>
</div>
<dialog id="dlg" aria-label="Kartu warga"><div class="card" id="dcard"></div><div class="actions"><button class="btn" type="button" id="d-map">Lihat di peta</button><button class="btn pri" type="button" id="d-close">Tutup</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

(function(){
var $=function(i){return document.getElementById(i)};
var COL=['#2fb7a8','#f2994a','#ff6b9a','#7aa7ff','#b58cff','#7bd88f','#ffc65c','#e8645a'],COLN=['Tosca','Oranye','Pink','Biru','Ungu','Hijau','Kuning','Merah'];
var BELT=['#f2c14e','#3a3f7a','#e5484d','#ffffff'],ACCN=['Antena','Rambut','Topi kerucut','Tanduk'];
var NAMA=[['AXIS','Menteri Wortel Berdasi'],['Aziky_gardener','Kepala Kebun Sawit','Relawan air Hari 4'],['FCmobilexx','Atlet E-Sport Kota'],['?','Kepala Bagian Kebingungan'],['masukan text','Juru Ketik Pidato Presiden'],['foudnthis_poser','Kolektor Barang Antik Mars'],['ALBI','Ketua Panitia 17 Agustus','Koordinator demo air'],['bruh_aria_ngeleg','Satpam Perumahan','Relawan air Hari 4'],['pin','Konsultan Tidur Siang'],['nanz','Ketua Suporter Klub Bola','Pemimpin yel-yel'],['pasya yp','Kasir Warung Sawit'],['ZHAFRANI','Spotter Roket Resmi','Relawan air Hari 4'],['Alfarizi.','Penjaga Malam Gelap Gulita'],['PP RAMADHAN_2026','Koki Burger Krabby'],['WongAngong','Penambang Kristal Mars','Relawan air Hari 4'],['Kyoto','Komikus Kota'],['dabelyu fatan','Nelayan Sungai Kering','Relawan air Hari 4'],['patrick jane','Detektif Kota'],['Harith','Mandor Sawit Berkacamata'],['tidak ada nama','Ketua RT Tanpa Nama','Peserta demo air']];
var BASE=NAMA.map(function(n,i){return{id:i,no:'MC-'+('000'+(i+1)).slice(-4),user:n[0],plat:'TikTok',prof:n[1],lencana:n[2]||'',slog:'',warna:i%8,acc:i%4,mata:i%3===0?1:2,slot:19+i}});
var WARGA=BASE.slice();
var IDE=['Tukang Bawa Galon','Pemain Golf Mars','Pemain Tenis','Penikmat Salmon Mentah','Chef Sushi Anti Banjir','Petugas Pajak Galon','Pilot Roket Antar Jemput','Penjaga Minimarket 24 Jam','Penanam Hutan Pertama','Pawang Sawit Layu'];
var uid=0;
// ===== PENGATURAN PENDAFTARAN (isi dua baris ini setelah bikin Google Form) =====
var CFG={
 prefill:'',  // tempel LINK ISI OTOMATIS dari Google Form (isinya AAA, BBB, CCC, DDD, EEE)
 sheetCsv:'https://docs.google.com/spreadsheets/d/e/2PACX-1vQLC4vEeSUPcCdygD_f36bhKoOKWXXU6Q7vAUxZB0sPXJxuHt0AuKuOMe8M0xE5hknjOST_EiztCnX4/pub?gid=2004462795&single=true&output=csv'  // database warga Mars City
};
var GF=false,FORMURL='',EN={};
(function(){try{if(!CFG.prefill||!CFG.sheetCsv)return;var u=new URL(CFG.prefill);FORMURL=u.origin+u.pathname.replace(/\/viewform$/,'/formResponse');var map={AAA:'user',BBB:'prof',CCC:'warna',DDD:'acc',EEE:'uid'};u.searchParams.forEach(function(v,k){if(map[v])EN[map[v]]=k});GF=!!(EN.user&&EN.prof&&EN.warna&&EN.acc&&EN.uid)}catch(e){GF=false}})();
function parseCSV(t){var rows=[],r=[],f='',q=false,i,c;for(i=0;i<t.length;i++){c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
async function sendGF(rec,id){var fd=new URLSearchParams();fd.append(EN.user,rec.user);fd.append(EN.prof,rec.prof);fd.append(EN.warna,COLN[rec.warna]||COLN[0]);fd.append(EN.acc,ACCN[rec.acc]||ACCN[0]);fd.append(EN.uid,id);await fetch(FORMURL,{method:'POST',mode:'no-cors',body:fd})}
async function loadSheet(){if(DB||!CFG.sheetCsv)return;try{var res=await fetch(CFG.sheetCsv+(CFG.sheetCsv.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'});var rows=parseCSV(await res.text());rows.shift();var by={},order=[];rows.forEach(function(c,i){var user=clean(c[1],24),accName=clean(c[2],30),prof=clean(c[3],34),colorName=clean(c[4],30);if(!user||!prof)return;var k='sheet-'+i;if(!(k in by)){order.push(k);by[k]={uid:k,t:i}}var o=by[k];o.user=user;o.prof=prof;o.warna=COLN.indexOf(colorName);if(o.warna<0)o.warna=(+colorName||0)%8;o.acc=ACCN.indexOf(accName);if(o.acc<0)o.acc=(+accName||0)%4});regs=order.map(function(k){return by[k]});refreshAll()}catch(e){console.warn('Gagal membaca Google Sheets:',e)}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
